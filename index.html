<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shell Price Comparison Tool</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f4f4f6;--bd:#d9d9de;--g:#d6f2dc;--gt:#14532d;--r:#fbdcdc;--rt:#7f1d1d;--a:#fff1c2;--at:#664d03;--y:#fbce07;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--fg:#ececf0;--mut:#9a9aa3;--card:#222228;--bd:#3a3a42;--g:#17391f;--gt:#9be5ab;--r:#451818;--rt:#f5a3a3;--a:#3d3210;--at:#f1d77a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}

button{cursor:pointer}.tabs button.on{background:var(--y);color:#222;border-color:var(--y);font-weight:600}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left}
th{background:var(--card);font-size:12px}td.n,th.n{text-align:right}
.g{background:var(--g);color:var(--gt)}.r{background:var(--r);color:var(--rt)}.a{background:var(--a);color:var(--at)}
.leg span,.chips span{display:inline-block;padding:3px 9px;border-radius:6px;margin:0 6px 6px 0;font-size:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;margin-left:4px}.muted{color:var(--mut)}
h3{margin:16px 0 6px;font-size:15px}.empty{padding:40px;text-align:center;color:var(--mut);border:2px dashed var(--bd);border-radius:12px}
small{color:var(--mut)}.note{background:var(--a);color:var(--at);padding:8px 12px;border-radius:8px;margin:8px 0}
details{margin-bottom:16px}summary{font-size:17px;font-weight:700;cursor:pointer;padding:6px 0}
.blk{margin:8px 0 14px}.blk th,.blk td{white-space:normal;min-width:120px;vertical-align:top}.blk th.rh{position:sticky;left:0;background:var(--card);min-width:120px}
[data-c]{position:relative;cursor:help}[data-c]::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent #e4a400 transparent transparent}
#tip{position:fixed;display:none;z-index:50;background:#222;color:#fff;max-width:280px;white-space:pre-line;padding:6px 9px;border-radius:6px;font-size:12px;box-shadow:0 2px 8px #0005}

.tag.fl{outline:none;background:var(--a);color:var(--at)}.cap{white-space:pre-line;font-size:12px;color:var(--mut);margin-top:2px}.upd{font-size:11px;color:var(--at);font-weight:600}
.tabs button.flash{animation:flash 1.1s infinite;outline:2px solid #e4a400}

.ct{margin:16px 0 4px;font-size:14px}.ct span{color:var(--mut);margin-left:6px}
.blk table{table-layout:fixed}.blk th,.blk td{word-break:break-word;min-width:0}.blk th.rh{min-width:0}

</style></head><body>
<h1>Shell Competition Price Benchmarking</h1>
<div class="bar"><button id="rf">Refresh</button><button id="xl">⬇ Download Excel report</button><small id="st"></small></div>
<div class="bar"><input id="q" placeholder="Search Shell SKU / API / viscosity…"></div>
<div class="bar tabs"><button data-t="cmp" class="on">Segment view</button><button data-t="sch" id="tb-sch">Schemes &amp; Additional Offers</button><button data-t="seg">Segment summary</button><button data-t="hi">Cheapest &amp; costliest</button></div>
<div id="info"></div>
<div id="out"><div class="empty">Loading live data…</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwybcLy3hbggfIsPQ8nTlLwDKV8_qLLW4BtQz_rhJPXIKhz3JZUZ0_BpoXnH5vP75xEZA/exec';  // Apps Script web app URL (…/exec)
const $=s=>document.querySelector(s);let SEG='',CH={},CAPMAP={},SPC=false,ALL=[],CAP={},FL=[],PC=[],tab='cmp',dim='c';
const ORD=['PCMO','MCO','CVO','AGRI','AUTO 3 WHEELER'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{v=parseFloat(String(v||'').replace(/[₹,\s]/g,''));return isNaN(v)?null:v};
const fm=n=>n==null?'–':'₹'+Math.round(n).toLocaleString('en-IN');
const nz=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const PK=/^(\d+(?:\.\d+)?)\s*(?:l|ltr|ltrs|lt|litre|litres)?$/i;
function parseSP(v){const o=[];(v||'').split(/[;|\n\/]+/).forEach(g=>{let cur=null;g.split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>{const m=t.match(PK);if(m&&cur)cur.packs.push(parseFloat(m[1]));else{cur={n:t,z:nz(t),packs:[]};o.push(cur)}})});return o}
function parseCSV(t){const o=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';o.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);o.push(r)}return o}
function visc(n,c){c=(c||'').toUpperCase().trim();let k=c.match(/^(\d{1,2})W-?(\d{2,3})$/);if(k)return k[1]+'W-'+k[2];if(/^\d{2,3}W$/.test(c)||/^(SAE|2T)/.test(c))return c;const m=(n+' ').match(/(\d{1,2})W-?(\d{2})/i);return m?m[1]+'W-'+m[2]:'N/A'}
function api(s){s=(s||'').toUpperCase();let m=s.match(/C[A-K]-4(\s?PLUS|\+)?/);if(m)return m[0].replace(/\s?PLUS/,'+').replace(/\s/g,'');m=s.match(/\bS[A-Q]\b/);if(m)return m[0];m=s.match(/GL-\d/);return m?m[0]:'N/A'}
function segOf(n,a,p,b){const s=n.toLowerCase(),f=(a||'').toUpperCase().replace(/^API\s*/,'').trim();
if(/auto power|cng (expert|power plus|extra mile|special)/.test(s))return'AUTO 3 WHEELER';
if(/\b4t\b|\b2t\b|8002t|scooter|super moto|moto 4|hi-perf|royal cruiser|racing|300v|advance a|advance f|champ|zipp|pride|syntrac|gp (power|ultimate)/.test(s))return'MCO';
if(/agri|tract|xhd|unitrac|dynatrans|utto|hdb|rimula r1|all fleet multi|turbo plus|turbo synth|mahindra/.test(s)||(/r3x|xld/.test(s)&&p>=6&&p<=10))return'AGRI';
if(b=='Castrol'||/quartz|all climate|universal|helix|x-clean|perfomax|ecomile|protec|8000|8100|4100|trd sport|multi g\+|multi fleet|super diesel x-10|max td|tata motors|formula|ultrasynth|mobil 1|super (all-in-one|friction|everyday)|genuine diesel|synpower/.test(s))return'PCMO';
return/^S/.test(f)&&!/multipurpose/.test(s)?'PCMO':'CVO'}
const load=txt=>loadTable(parseCSV(txt));
function loadTable(t,changes){const H=t[0].map(x=>x.trim()),L=H.map(x=>x.toLowerCase()),ix=k=>L.indexOf(k),seen=new Set();ALL=[];CAP={};FL=[];PC=[];CH={};CAPMAP={};
const I={s:ix('shell products')>=0?ix('shell products'):ix('shell product'),b:ix('brand'),n:ix('product name'),p:ix('pack size'),v:ix('viscosity grade'),a:ix('api specification'),t:ix('oil technology'),c:ix('category')>=0?ix('category'):ix('segment')};
SPC=I.s>=0;if(I.b<0||I.n<0||I.p<0){$('#out').innerHTML='<div class="empty">Could not find Brand / Product Name / Pack Size headers.</div>';return}
let end=H.findIndex((h,i)=>i>I.b&&!h);if(end<0)end=H.length;const capOf=h=>{let m=h.match(/^caption\s*[-:–]\s*(.*)$/i)||h.match(/^(.*?)\s*\(\s*caption\s*\)$/i);return m?m[1].trim():null};
H.forEach((h,i)=>{const c=capOf(h);if(c!==null)CAP[i]=nz(c);else if(i<end&&![I.b,I.n,I.c,I.s].includes(i))FL.push({i,h})});
const first=['pack size','api specification','viscosity grade','oil technology'];FL.sort((x,y)=>{const a=first.indexOf(x.h.toLowerCase()),b=first.indexOf(y.h.toLowerCase());return(a<0?99:a)-(b<0?99:b)||x.i-y.i});
PC=FL.filter(f=>/^(dlp|mrp|net rbp|mlp.*)$/i.test(f.h));
Object.keys(CAP).forEach(i=>{const g=FL.find(f=>nz(f.h)==CAP[i])||FL.find(f=>nz(f.h).startsWith(CAP[i]))||FL.find(f=>nz(f.h).includes(CAP[i]));CAPMAP[nz(H[i])]=g?g.h:'Product Name'});
for(const r of t.slice(1)){const b=(r[I.b]||'').trim();if(!b)continue;const n=(r[I.n]||'').trim(),p=num(r[I.p]),raw={},cm={},pr={};
FL.forEach(f=>raw[f.h]=(r[f.i]||'').trim());PC.forEach(f=>pr[f.h]=num(r[f.i]));
const k=[b,n,p,JSON.stringify(pr)].join('|');if(seen.has(k))continue;seen.add(k);
Object.keys(CAP).forEach(i=>{const x=(r[i]||'').trim();if(!x)return;const g=FL.find(f=>nz(f.h)==CAP[i])||FL.find(f=>nz(f.h).startsWith(CAP[i]))||FL.find(f=>nz(f.h).includes(CAP[i])),key=g?g.h:'Product Name';cm[key]=cm[key]?cm[key]+'\n'+x:x});
const ap=I.a>=0?r[I.a]:'';ALL.push({k:[b,n,(r[I.p]||'').trim()].join('|').toLowerCase(),sp:b=='Shell'||I.s<0?[]:parseSP(r[I.s]),b,n,p,c:I.c>=0&&(r[I.c]||'').trim()?r[I.c].trim().toUpperCase():segOf(n,ap,p,b),v:visc(n,I.v>=0?r[I.v]:''),a:ap,ak:api(ap),t:I.t>=0?(r[I.t]||'').trim():'',raw,cm,pr})}
const has=PC.findIndex(f=>ALL.some(r=>r.pr[f.h]!=null));

$('#info').innerHTML=`<div class="note">${ALL.length} products loaded. ${I.c<0?'The sheet has no Category column, so segments are assigned from product name / API / pack size. Add a “Category” column for exact grouping. ':''}${SPC?'':'No “Shell Products” column found, so competition products are auto-matched by segment and viscosity. '}${has<0?'No price values found yet in '+(PC.map(f=>esc(f.h)).join(', ')||'any price column')+', so the ₹/L comparison, summary and cheapest / costliest views stay empty until prices are filled.':''}</div>`;(changes||[]).forEach(c=>{const h=CAPMAP[nz(c.f)]||c.f,k=c.k+'|'+nz(h),t=Date.parse(c.t);if(t&&(!CH[k]||t>CH[k]))CH[k]=t});render()}
const BASIS=()=>PC.find(f=>/net rbp/i.test(f.h))||PC.find(f=>ALL.some(r=>r.pr[f.h]!=null))||PC[0];
function R(){const f=BASIS();return ALL.map(r=>{const v=f?r.pr[f.h]:null;return{...r,ppl:v&&r.p?v/r.p:null}})}
const Rp=rs=>rs.filter(r=>r.ppl!=null&&r.ppl>0);
const col=d=>d<-2?'g':d>2?'r':'a';const dcol=d=>Math.abs(d)<0.5?'a':d>0?'g':'r';
function stats(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x.ppl-y.ppl);return{n:a.length,avg:a.reduce((t,x)=>t+x.ppl,0)/a.length,lo:s[0],hi:s[s.length-1]}}
const desc=r=>`${r.b} · ${r.n} · ${r.p}L`;
const isNew=(r,h)=>{const t=CH[r.k+'|'+nz(h)];return t&&Date.now()-t<1728e5?t:0};
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const TRF=()=>FL.filter(f=>/scheme|booster|offer|mlp/i.test(f.h));
function tabBadge(rs){const T=TRF(),n=new Set(rs.filter(r=>T.some(f=>isNew(r,f.h))).map(r=>r.b+'|'+r.n)).size,b=$('#tb-sch');b.classList.toggle('flash',n>0);b.innerHTML='Schemes &amp; Additional Offers'+(n?` <span class="tag fl">${n} updated</span>`:'')}
function model(rs){const q=$('#q').value.toLowerCase(),shell=rs.filter(r=>r.b=='Shell'),BR=[...new Set(rs.filter(r=>r.b!='Shell').map(r=>r.b))],sv={},ss={},links={};
shell.forEach(s=>{sv[s.n]=s.v;ss[s.n]=s.c});const SN=Object.keys(sv),add=(x,r,pk)=>(links[x]=links[x]||[]).push({r,pk});
rs.filter(r=>r.b!='Shell').forEach(r=>{
if(SPC)r.sp.forEach(e=>{if(!e.z)return;let ms=SN.filter(x=>nz(x).includes(e.z));const same=ms.filter(x=>sv[x]==r.v);if(same.length)ms=same;ms.forEach(x=>add(x,r,e.packs))});
else SN.forEach(x=>{if(ss[x]==r.c&&sv[x]==r.v)add(x,r,[])})});
const segs=[];for(const c of[...new Set(shell.map(s=>s.c))].sort((x,y)=>ORD.indexOf(x)-ORD.indexOf(y))){
const sh=shell.filter(r=>r.c==c&&(r.n+' '+r.v+' '+r.a+' '+r.p).toLowerCase().includes(q)).sort((x,y)=>x.n.localeCompare(y.n)||x.p-y.p);if(!sh.length)continue;
segs.push({c,cards:sh.map(s=>{const al=[...new Set((links[s.n]||[]).filter(o=>o.pk.length?o.pk.some(k=>Math.abs(k-s.p)<1e-6):Math.abs(o.r.p-s.p)<1e-6).map(o=>o.r))];
return{s,cols:BR.map(b=>{const m=al.filter(r=>r.b==b).sort((x,y)=>(x.ak==s.ak?0:1)-(y.ak==s.ak?0:1)||(x.t==s.t?0:1)-(y.t==s.t?0:1));return{b,r:m[0]||null,more:m.slice(1)}})}})})}
return{BR,segs}}
function grid(c){const s=c.s,cs=[s,...c.cols.map(x=>x.r)],rows=[],bl=BASIS();
FL.forEach(f=>{const vs=cs.map(r=>r?(/viscosity/i.test(f.h)?r.v:(r.raw[f.h]||'')):'');if(!vs.some(x=>x)&&!cs.some(r=>r&&r.cm[f.h]))return;
rows.push({label:f.h,cells:cs.map((r,i)=>r?{t:(vs[i]||'—')+(/pack size/i.test(f.h)&&i&&r.p!=s.p?' (≠ Shell)':''),cm:r.cm[f.h]||'',fl:isNew(r,f.h)>0}:null)})});
if(s.ppl!=null&&c.cols.some(x=>x.r&&x.r.ppl!=null))rows.push({label:'Price difference vs Shell (₹/Ltr)',sub:bl?bl.h:'',cells:cs.map((r,i)=>{if(!r)return null;if(!i)return{t:'Base (Shell)',cls:'muted'};if(r.ppl==null)return{t:'—'};const d=r.ppl-s.ppl;return{t:(d>0?'+':d<0?'−':'')+'₹'+Math.abs(d).toFixed(1)+'/L',cls:dcol(d),title:`${fm(r.ppl)}/L vs Shell ${fm(s.ppl)}/L`}})});
return{head:cs.map((r,i)=>({b:i?c.cols[i-1].b:'Shell',n:r?r.n:'',cm:r?r.cm['Product Name']||'':''})),rows}}
function blk(c){const g=grid(c),s=c.s,N=g.head.length+1,w=(100/N).toFixed(3),R=g.rows.length;
const th=g.head.map(h=>h.n?`<th${h.cm?` data-c="${esc(h.cm)}"`:''}><small>${esc(h.b)}</small><br>${esc(h.n)}</th>`:`<th class="na"><small>${esc(h.b)}</small><br>Not Available</th>`).join('');
const body=g.rows.map((r,ri)=>`<tr><th class="rh">${esc(r.label)}${r.sub?`<br><small>${esc(r.sub)}</small>`:''}</th>${r.cells.map(x=>x?`<td class="${x.cls||''}${x.fl?' fl':''}"${x.cm?` data-c="${esc(x.cm)}"`:''}${x.title?` title="${esc(x.title)}"`:''}>${/^[gra]$/.test(x.cls||'')?`<b>${esc(x.t)}</b>`:esc(x.t)}</td>`:'<td class="na"></td>').join('')}</tr>`).join('');
const more=c.cols.filter(x=>x.more.length).map(x=>`${esc(x.b)}: ${x.more.map(m=>esc(m.n)).join(', ')}`);
return`<div class="ct"><b>${esc(s.n)}</b> <span>${s.p} L pack</span></div><div class="wrap blk"><table style="min-width:${N*130}px"><colgroup>${('<col style="width:'+w+'%">').repeat(N)}</colgroup><tr><th class="rh">Brand</th>${th}</tr>${body}</table></div>`+(more.length?`<p class="muted">Also mapped for this pack (not shown): ${more.join(' · ')}</p>`:'')}
function setSeg(g){SEG=g;render()}
function cmp(rs){const M=model(rs),P=Rp(rs);if(!M.segs.length)return'<div class="empty">No Shell SKUs match.</div>';
if(!M.segs.some(g=>g.c==SEG))SEG=M.segs[0].c;const sg=M.segs.find(g=>g.c==SEG),st=stats(P.filter(r=>r.c==sg.c)),sa=stats(P.filter(r=>r.c==sg.c&&r.b=='Shell'));
return`<div class="stabs">${M.segs.map(g=>`<button class="${g.c==SEG?'on':''}" data-s="${esc(g.c)}" onclick="setSeg(this.dataset.s)">${esc(g.c)} <small>${g.cards.length}</small></button>`).join('')}</div>
<p class="leg"><span class="g">Competitor price higher than Shell (+₹/Ltr)</span><span class="a">Same as Shell</span><span class="r">Competitor price lower than Shell (−₹/Ltr)</span><small>Orange corner = comment from a Caption column. Same pack size is compared, unless a pack is given after the comma in Shell Products.</small></p>`+
(st?`<p class="chips"><span class="r">Cheapest: ${fm(st.lo.ppl)}/L · ${esc(desc(st.lo))}</span><span class="g">Costliest: ${fm(st.hi.ppl)}/L · ${esc(desc(st.hi))}</span>${sa?`<span class="a">Shell avg: ${fm(sa.avg)}/L</span>`:''}</p>`:'')+sg.cards.map(blk).join('')}
function sch(rs){const q=$('#q').value.toLowerCase(),T=TRF();
if(!T.length)return'<div class="empty">No scheme / booster / MLP columns found in the sheet.</div>';
const BRS=['Shell',...new Set(rs.filter(r=>r.b!='Shell').map(r=>r.b))];
let h='<p class="leg"><span class="fl">Flashing = updated in the last 48 hours</span><small>Grouped by offer – products with the same offer and caption are combined. Shell is included.</small></p>',any=false;
for(const f of T){const G={};rs.filter(r=>(r.raw[f.h]||r.cm[f.h])&&(r.b+' '+r.n).toLowerCase().includes(q)).forEach(r=>{const v=r.raw[f.h]||'',cm=r.cm[f.h]||'',k=[r.b,r.c,v,cm].join('\u0001');(G[k]=G[k]||{b:r.b,c:r.c,v,cm,rows:[]}).rows.push(r)});
const gs=Object.values(G).sort((x,y)=>BRS.indexOf(x.b)-BRS.indexOf(y.b)||ORD.indexOf(x.c)-ORD.indexOf(y.c));if(!gs.length)continue;any=true;
h+=`<h3>${esc(f.h)} <small>${gs.length} offers</small></h3><div class="wrap"><table><tr><th>Brand</th><th>Segment</th><th>Offer</th><th>Details / caption</th><th>Applicable products (pack, L)</th></tr>${gs.map(g=>{const t=Math.max(0,...g.rows.map(r=>isNew(r,f.h))),by={};g.rows.forEach(r=>(by[r.n]=by[r.n]||[]).push(r.p));
return`<tr><td><b>${esc(g.b)}</b>${g.b=='Shell'?' <span class="tag a">Shell</span>':''}</td><td>${esc(g.c)}</td><td${t?' class="fl"':''}>${g.v?`<b>${esc(g.v)}</b>`:'<span class="muted">—</span>'}${t?`<div class="upd">Updated ${ago(t)}</div>`:''}</td><td class="cap">${g.cm?esc(g.cm):'—'}</td><td>${Object.keys(by).sort().map(n=>`<div>${esc(n)} <small>${[...new Set(by[n])].sort((a,b)=>a-b).join(', ')}</small></div>`).join('')}</td></tr>`}).join('')}</table></div>`}
return any?h:'<div class="empty">No schemes, additional offers or MLP entered yet.</div>'}
const NOP='<div class="empty">No price values in the selected price column yet.</div>';
function seg(rs){const P=Rp(rs);if(!P.length)return NOP;const bs=[...new Set(P.map(r=>r.b))].sort(),cats=[...new Set(P.map(r=>r.c))].sort((x,y)=>ORD.indexOf(x)-ORD.indexOf(y)),sel='';let h='';
for(const c of cats.filter(c=>!sel||c==sel)){const sr=stats(P.filter(r=>r.b=='Shell'&&r.c==c));
h+=`<h3>${esc(c)}</h3><div class="wrap"><table><tr><th>Brand</th><th class="n">SKUs</th><th class="n">Avg ₹/L</th><th class="n">Cheapest ₹/L</th><th class="n">Costliest ₹/L</th><th class="n">Brand avg vs Shell (₹/Ltr)</th></tr>`;
for(const b of bs){const s=stats(P.filter(r=>r.b==b&&r.c==c));if(!s)continue;let d='';if(b=='Shell')d='<span class="tag a">Shell</span>';else if(sr){const p=s.avg-sr.avg;d=`<span class="${dcol(p)} tag">${p>0?'+':p<0?'−':''}₹${Math.abs(p).toFixed(1)}/L</span>`}
h+=`<tr><td><b>${esc(b)}</b></td><td class="n">${s.n}</td><td class="n">${fm(s.avg)}</td><td class="n" title="${esc(desc(s.lo))}">${fm(s.lo.ppl)}</td><td class="n" title="${esc(desc(s.hi))}">${fm(s.hi.ppl)}</td><td class="n">${d}</td></tr>`}h+='</table></div>'}
return`<p class="leg"><span class="g">Brand avg higher than Shell</span><span class="r">Brand avg lower than Shell</span></p>`+h}
function hiData(rs){const P=Rp(rs),cat='',q=$('#q').value.toLowerCase(),g={};
P.filter(r=>(!cat||r.c==cat)&&r.p).forEach(r=>{const k=r.ak+'|'+r.v+'|'+r.p;(g[k]=g[k]||[]).push(r)});
return Object.values(g).filter(a=>a.length>1&&(a[0].ak+' '+a[0].v+' '+a[0].p).toLowerCase().includes(q)).map(a=>{const s=stats(a),srt=[...a].sort((x,y)=>x.ppl-y.ppl),sh=srt.find(r=>r.b=='Shell');return{api:a[0].ak,v:a[0].v,p:a[0].p,n:a.length,lo:s.lo,hi:s.hi,shell:sh,rank:sh?srt.indexOf(sh)+1:0}}).sort((x,y)=>(!!y.shell)-(!!x.shell)||x.api.localeCompare(y.api)||x.v.localeCompare(y.v)||x.p-y.p)}
function hi(rs){if(!Rp(rs).length)return NOP;const D=hiData(rs);if(!D.length)return'<div class="empty">No like-for-like combinations found.</div>';
return`<p class="leg"><span class="r">Cheapest ₹/L</span><span class="g">Costliest ₹/L</span><small>Like-for-like: same API grade + viscosity grade + pack size. Combinations with a Shell SKU come first.</small></p><div class="wrap"><table><tr><th>API grade</th><th>Viscosity</th><th class="n">Pack (L)</th><th class="n">SKUs</th><th>Cheapest ₹/L</th><th>Costliest ₹/L</th><th>Shell ₹/L (best)</th></tr>${D.map(d=>`<tr><td><b>${esc(d.api)}</b></td><td>${esc(d.v)}</td><td class="n">${d.p}</td><td class="n">${d.n}</td><td class="r">${fm(d.lo.ppl)}/L<br><small>${esc(d.lo.b+' · '+d.lo.n)}</small></td><td class="g">${fm(d.hi.ppl)}/L<br><small>${esc(d.hi.b+' · '+d.hi.n)}</small></td><td class="a">${d.shell?`${fm(d.shell.ppl)}/L<br><small>Rank ${d.rank} of ${d.n} (1 = cheapest)</small>`:'<span class="muted">no Shell SKU</span>'}</td></tr>`).join('')}</table></div>`}
function render(){if(!ALL.length)return;const rs=R();$('#out').innerHTML=tab=='cmp'?cmp(rs):tab=='sch'?sch(rs):tab=='seg'?seg(rs):hi(rs);tabBadge(rs);const d=$('#dim');if(d){d.value=dim;d.onchange=()=>{dim=d.value;render()}}}
['q'].forEach(i=>$('#'+i).addEventListener(i=='q'?'input':'change',render));
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));render()});
const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
function showTip(e){const t=e.target.closest('[data-c]');if(!t){tip.style.display='none';return}tip.textContent=t.dataset.c;tip.style.display='block';const r=t.getBoundingClientRect();tip.style.left=Math.max(6,Math.min(r.left,innerWidth-tip.offsetWidth-6))+'px';tip.style.top=(r.bottom+tip.offsetHeight+8>innerHeight?r.top-tip.offsetHeight-4:r.bottom+4)+'px'}
document.addEventListener('mouseover',showTip);document.addEventListener('click',showTip);
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function ensureXL(){if(window.ExcelJS)return;try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')}catch(e){await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js')}}
function buildWb(rs){const M=model(rs),wb=new ExcelJS.Workbook(),N=M.BR.length+2,ln={style:'thin',color:{argb:'FFD9D9DE'}},bd={top:ln,left:ln,bottom:ln,right:ln},fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+a}}),PAL={g:['D6F2DC','14532D'],r:['FBDCDC','7F1D1D'],a:['FFF1C2','664D03']};
let ws,row=1;
const put=(r,c,t,o={})=>{const x=ws.getCell(r,c);x.value=t;x.alignment={wrapText:true,vertical:'middle',horizontal:'left'};x.border=bd;const fo={};if(o.b)fo.bold=true;if(o.fc)fo.color={argb:'FF'+o.fc};if(o.b||o.fc)x.font=fo;if(o.f)x.fill=fill(o.f);if(o.n)x.note=o.n;return x};
for(const sg of M.segs){ws=wb.addWorksheet(sg.c);ws.columns=Array.from({length:N},()=>({width:26}));row=1;ws.mergeCells(row,1,row,N);put(row,1,sg.c+' · '+sg.cards.length+' Shell SKUs',{b:1,f:'FBCE07'});row++;
for(const c of sg.cards){const g=grid(c);ws.mergeCells(row,1,row,N);put(row,1,c.s.n+' · '+c.s.p+' L pack',{b:1,f:'EDEDF0'});row++;
put(row,1,'Brand',{b:1,f:'F4F4F6'});g.head.forEach((h,i)=>put(row,i+2,h.b+'\n'+(h.n||'Not Available'),{b:1,f:'F4F4F6',fc:h.n?'':'888888',n:h.cm}));row++;
const r0=row;g.rows.forEach(r=>{put(row,1,r.label+(r.sub?'\n'+r.sub:''),{b:1,f:'F4F4F6'});r.cells.forEach((x,i)=>{if(!x){put(row,i+2,'');return}const p=PAL[x.cls];put(row,i+2,x.t,{b:!!p,f:p?p[0]:x.fl?'FFF1C2':'',fc:p?p[1]:'',n:x.cm})});row++});
row++}}
const w2=wb.addWorksheet('Cheapest & Costliest');w2.columns=[16,14,10,8,46,46,16,22].map(width=>({width}));
['API grade','Viscosity','Pack (L)','SKUs','Cheapest ₹/L','Costliest ₹/L','Shell ₹/L (best)','Shell rank (1 = cheapest)'].forEach((t,i)=>{const x=w2.getCell(1,i+1);x.value=t;x.font={bold:true};x.fill=fill('FBCE07');x.border=bd});
hiData(rs).forEach((d,k)=>[d.api,d.v,d.p,d.n,fm(d.lo.ppl)+'/L · '+desc(d.lo),fm(d.hi.ppl)+'/L · '+desc(d.hi),d.shell?fm(d.shell.ppl)+'/L':'—',d.rank||'—'].forEach((t,i)=>{const x=w2.getCell(k+2,i+1);x.value=t;x.border=bd;x.alignment={wrapText:true,vertical:'top'};if(i==4)x.fill=fill('FBDCDC');if(i==5)x.fill=fill('D6F2DC')}));
w2.views=[{state:'frozen',ySplit:1}];return wb}
async function exportXlsx(){const st=$('#st');if(!ALL.length)return;try{st.textContent='Building Excel report…';await ensureXL();const buf=await buildWb(R()).xlsx.writeBuffer(),a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='Shell_Competition_Price_Benchmarking_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();st.textContent='Excel report downloaded'}catch(e){st.textContent='Excel export failed: '+e.message}}
$('#xl').onclick=exportXlsx;
let VER='',timer=null;
const apiUrl=a=>{const u=new URL(API_URL);if(a)u.searchParams.set('action',a);return u.toString()};
async function pull(force){const st=$('#st');if(!API_URL||/^PASTE/.test(API_URL)){st.textContent='Set API_URL at the top of the script (Apps Script web app URL).';return}
try{if(!force&&VER){const v=await(await fetch(apiUrl('version'))).json();if(v.error)throw new Error(v.error);if(v.version===VER){render();st.textContent='Up to date · checked '+new Date().toLocaleTimeString();return}}
const d=await(await fetch(apiUrl())).json();if(d.error)throw new Error(d.error);
VER=d.version;loadTable([d.headers,...d.rows],d.changes);render();
st.textContent='Live data · '+ALL.length+' products · updated '+new Date().toLocaleTimeString()}catch(e){st.textContent='API error: '+e.message}}
$('#rf').onclick=()=>pull(true);pull(true);setInterval(()=>pull(false),60000);
</script></body></html>
